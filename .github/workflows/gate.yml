name: gate

# Ola 1 (docs/PROMPT_CORRECTIVO.md §9.3): el gate único corre en cada push. No hace falta
# `gh` para esto — el archivo se escribe y se empuja con git, como el propio documento
# indica. Sin servicios de BD: DB_MODE por defecto es pglite (embebido, cero instalación),
# así que check.sh --full corre sin secretos ni contenedores.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm ANTES que setup-node: la acción de node necesita saber qué gestor cachear.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      # Solo Chromium: playwright.config.ts usa devices["iPhone 13"], que es Chromium.
      # --with-deps trae las librerías de sistema que el runner de Ubuntu no trae de serie.
      - name: Instalar navegador de Playwright (Chromium)
        run: pnpm --filter kilopan exec playwright install --with-deps chromium

      - name: check.sh --full
        run: pnpm check:full

      # check.sh redirige el output DETALLADO de cada paso (prueba-arnes.sh, playwright,
      # etc.) a packages/metodo/panel/ultimo-check.log — la consola de CI solo ve el
      # resumen == OK/FALLÓ ==. Descargar el artefacto de abajo exige sesión web (no API
      # ni navegador automatizado sin login), así que ademas se vuelca a la CONSOLA del
      # paso — texto plano, legible sin descargar nada — cuando el gate de arriba falla.
      - name: Volcar ultimo-check.log a la consola (solo si el gate falló)
        if: failure()
        # SIN ::group:: — GitHub lo pliega en un fold que un lector automatizado (sin
        # sesión interactiva) no puede expandir de forma confiable. Texto plano con
        # marcador de línea y conteo, para que "no hay output" sea indistinguible de
        # "hay output pero no se ve" — LOGLINE| en cada línea también evita que una
        # línea del propio log que empiece con "::" se interprete como comando de
        # workflow.
        run: |
          if [ -f packages/metodo/panel/ultimo-check.log ]; then
            echo "GATE-LOG-INICIO archivo existe, $(wc -l < packages/metodo/panel/ultimo-check.log) lineas"
            sed 's/^/LOGLINE| /' packages/metodo/panel/ultimo-check.log
            echo "GATE-LOG-FIN"
          else
            echo "GATE-LOG-INICIO no existe el archivo"
            echo "GATE-LOG-FIN"
          fi

      - name: Subir ultimo-check.log y reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ github.sha }}
          path: |
            packages/metodo/panel/ultimo-check.log
            apps/kilopan/playwright-report/
            apps/kilopan/test-results/
          if-no-files-found: ignore
          retention-days: 14
