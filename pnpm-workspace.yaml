packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Ambos son dependencias nativas legítimas y conocidas, requeridas transitivamente
  # por Next.js (sharp, optimización de imágenes) y por eslint-config-next
  # (unrs-resolver, resolución de imports) — no scripts de terceros desconocidos.
  sharp: true
  unrs-resolver: true
overrides:
  # AC-SEC-03: versiones mínimas parcheadas, forzadas sobre toda la resolución —
  # sharp/postcss llegan transitivos vía next, brace-expansion vía eslint. No son
  # dependencias directas del proyecto, así que no basta con "actualizar el paquete".
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  # 3-ago-2026: sube de >=5.0.8 a >=5.0.9 por GHSA-rgw5-rvv9-x895 (DoS por arrays
  # intermedios sin cota, que además evade la mitigación de CVE-2026-14257). El advisory
  # salió con el override ya puesto: una versión de diferencia bastó para poner `audit` en
  # rojo y, con él, TODO el gate. No es cosmético para el motor — el agente obedece «no
  # comitear sin verde», así que un rojo ajeno a su AC lo deja en «sin avance» habiendo
  # hecho el trabajo, y a los tres intentos el AC queda marcado atascado por nada.
  brace-expansion: ">=5.0.9"
  # 6-ago-2026: js-yaml a >=4.3.1 por CVE-2026-59870 / GHSA-5p4m-2wfm-xmqj (consumo
  # cuadrático de CPU en la resolución de !!omap; parche en 4.3.1, no backporteado a 3.x).
  # Transitiva vía @eslint/eslintrc — 24 rutas, todas por eslint, ninguna directa. Mismo
  # motivo que brace-expansion: un high en `audit` pone TODO el gate en rojo y ningún AC
  # puede comitear hasta el override.
  js-yaml: ">=4.3.1"
