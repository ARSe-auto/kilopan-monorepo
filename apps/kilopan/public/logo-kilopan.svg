<!-- Marca de KiloPan: balanza blanca dentro de un cuadrado de aristas redondeadas,
     degradado ámbar (#D97706 → #B45309). Es la misma marca de kilopan.cl y del deck
     de la propuesta; vive acá, versionada en el repo, para que sea el único origen de
     verdad y nadie tenga que inventar un ícono cuando no lo encuentra. Los PNG del PWA
     (icono-192/512) se rasterizan desde este archivo.

     El trazo de la balanza es literalmente el del sitio; en vez de recalcular
     coordenadas a mano va escalado al 61 % (28 px de glifo sobre 46 px de cuadrado,
     la proporción del header de kilopan.cl) para que un diff contra el sitio siga
     siendo legible. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="KiloPan">
  <defs>
    <linearGradient id="marcaKiloPan" x1="0" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#D97706"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5.25" fill="url(#marcaKiloPan)"/>
  <g transform="translate(12 12) scale(0.61) translate(-12 -12)"
     stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v14M8.5 20h7M6 8h12M6 8L4 12.2a2.5 2.5 0 0 0 5 0L7 8M18 8l2 4.2a2.5 2.5 0 0 1-5 0L17 8"/>
  </g>
</svg>
